<!DOCTYPE html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="/iasa_kiosk/kiosk_favicon.jpeg">
</head>


<html>
    <body>
        <script type="module">
            import Fuse from "https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.mjs";
            import * as databaseHandler from "./database_handling.js"
            import * as globals from "./global_variables.js"

            await databaseHandler.init()

            const perfectScoreTolerance = 0.001

            var allCustomers = await databaseHandler.getCustomersFromGrades(globals.getActiveGrades())
            var customerNameUUIDMap = allCustomers["names"]
            const allCustomersNames = Object.keys(customerNameUUIDMap)

            const customerSearch = new Fuse(
                allCustomersNames,
                {
                    includeMatches: false, 
                    useTokenSearch: true,
                    includeScore: true
                }
            )
            
            
            const customerNameInput = document.getElementById("customerNameInput")
            const customerList = document.getElementById("customerList")
            var selectedName = null
            
            function renderCustomerList(names) {
                customerList.replaceChildren()
                for (const name of names) {
                    const li = document.createElement("li")
                    li.textContent = name
                    li.addEventListener("mousedown", (e) => {
                        e.preventDefault()               // keeps input from blurring first
                        selectedName = name
                        customerNameInput.value = li.textContent
                        customerList.hidden = true
                    })
                    customerList.appendChild(li)
                }
                customerList.hidden = names.length === 0
            }
            
            function refreshCustomers() {
                const q = customerNameInput.value.trim()
                renderCustomerList(q === "" ? allCustomersNames : customerSearch.search(q).map(r => r.item))
            }
            
            customerNameInput.addEventListener("focus", refreshCustomers)
            customerNameInput.addEventListener("input", () => { selectedName = null; refreshCustomers() })
            customerNameInput.addEventListener("blur", () => {
                customerList.hidden = true;
                if (customerSearch.search(customerNameInput.value.trim())[0].score < perfectScoreTolerance) {
                    selectedName = customerNameInput.value.trim()
                }
            })

            const paymentSizeInput = document.getElementById("paymentSizeInput")

            paymentSizeInput.addEventListener('blur', (event) => {
                paymentSizeInput.value = Math.round(paymentSizeInput.value * 10) / 10
            });
            
                        
            document.getElementById("savePayment").addEventListener("click", async () => {
                if (selectedName != null) {
                    await databaseHandler.savePayment(customerNameUUIDMap[selectedName], paymentSizeInput.value*10, document.getElementById("paymentMethod").value == "cash")
                    customerNameInput.value = ""
                    paymentSizeInput.value = 0
                }
            })
        </script>

        <button id="savePayment">תשלם!</button><br>
        <div class="autocomplete">
            <label for="customerNameInput">הכנס שם לקוח:</label>
            <input type="text" id="customerNameInput" autocomplete="off">
            <ul id="customerList" class="autoCompleteList" hidden></ul>
        </div><br>
        <label for="paymentSizeInput">הכנס מחיר מוצר:</label>
        <input type="number" id="paymentSizeInput" min="0.1" step="0.1" placeholder="הכנס מחיר מוצר..."><br>
        <label for="paymentMethod">דרך תשלום:</label>
        <select name="דרך תשלום" id="paymentMethod">
            <option value="cash">מזומן</option>
            <option value="bit">ביט</option>
        </select>
    </body>
</html>
