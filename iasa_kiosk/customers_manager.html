<!DOCTYPE html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="/iasa_kiosk/kiosk_favicon.jpeg">
</head>


<html>
    <body>
        <script type="module">
            import * as databaseHandler from "./database_handling.js"
            import * as globals from "./global_variables.js"

            document.addEventListener('keydown', function(event) {
                // Check if the pressed key is 'Enter' and the active element is an input
                if (event.key === 'Enter' && event.target.tagName === 'INPUT') {
                    event.target.blur(); // Removes focus from the input
                }
            });

            await databaseHandler.init()

            var originalCustomers = (await databaseHandler.getCustomersFromGrades(globals.getActiveGrades()))["full_data"]
            var customers = JSON.parse(JSON.stringify(originalCustomers))
            var displayTable = document.getElementById("customersTable")
            var indexToWrite = 1
            var rowAmount = 2
            customers.forEach((customer, index) => {
                var newRow = displayTable.insertRow(rowAmount - 1)
                rowAmount++

                var idCell = newRow.insertCell(0)
                idCell.textContent = indexToWrite
                indexToWrite++


                var nameCell = newRow.insertCell(1)
                var nameInput = document.createElement("input")
                nameInput.type = "text";
                nameInput.id = "name-" + (index + 1);

                nameInput.placeholder = "הכנס שם תלמיד..."
                nameInput.value = customer["data"]["NAME"]

                nameInput.addEventListener('blur', (event) => {
                    nameInput.value = nameInput.value.trim()
                    customer["data"]["NAME"] = nameInput.value
                });
                nameCell.appendChild(nameInput)


                var debtCell = newRow.insertCell(2)
                if (!Object.hasOwn(customer["data"]["CURRENT_DEBT"], String(globals.getOperatingGrade()))) {
                    customer["data"]["CURRENT_DEBT"][String(globals.getOperatingGrade())] = 0
                }
                debtCell.textContent = customer["data"]["CURRENT_DEBT"][String(globals.getOperatingGrade())]/10;


                var roomCell = newRow.insertCell(3)
                var roomInput = document.createElement('input');

                roomInput.type = 'number';

                roomInput.id = 'room-' + (rowAmount - 1);
                roomInput.placeholder = "הכנס מס' חדר (עבור יומיים להשאיר ריק)..."
                roomInput.value = customer["data"]["ROOM_NUMBER"];
                roomInput.step = '1';

                roomInput.addEventListener('blur', (event) => {
                    roomInput.value = parseInt(roomInput.value)
                    customer["data"]["ROOM_NUMBER"] = roomInput.value
                });

                roomCell.appendChild(roomInput)

                
                var gradeCell = newRow.insertCell(4)
                gradeCell.textContent = customer["data"]["GRADE"];


                var phoneCell = newRow.insertCell(5)
                var phoneInput = document.createElement('input');

                phoneInput.type = 'tel';

                phoneInput.id = 'phone-' + (rowAmount - 1);
                phoneInput.placeholder = "הכנס מס' טלפון..."
                phoneInput.value = customer["data"]["PHONE_NUMBER"];

                phoneInput.addEventListener('blur', (event) => {
                    phoneInput.value = phoneInput.value.replace(/\D/g, '');
                    customer["data"]["PHONE_NUMBER"] = phoneInput.value
                });

                phoneCell.appendChild(phoneInput)


                var customerTypeCell = newRow.insertCell(6)
                var customerTypeInput = document.createElement("select")
                customerTypeInput.id = "customer-type-" + (index + 1);

                globals.getCustomerTypes().forEach(type => {
                    const option = document.createElement("option")
                    option.value = type
                    option.textContent = type
                    customerTypeInput.appendChild(option)
                })
                
                customerTypeInput.value = customer["data"]["CUSTOMER_TYPE"]

                customerTypeInput.addEventListener('change', (event) => {
                    customer["data"]["CUSTOMER_TYPE"] = customerTypeInput.value
                });

                customerTypeCell.appendChild(customerTypeInput)
            });
            
            function addCustomer(startingValues) {
                var newRow = displayTable.insertRow(rowAmount - 1)
                rowAmount++

                customers.push({
                    "UUID": crypto.randomUUID(),
                    "data": {
                        "GRADE": startingValues["GRADE"],
                        "PHONE_NUMBER": startingValues["PHONE_NUMBER"],
                        "NAME": startingValues["NAME"],
                        "ROOM_NUMBER": startingValues["ROOM_NUMBER"],
                        "CUSTOMER_TYPE": startingValues["CUSTOMER_TYPE"],
                        "CURRENT_DEBT": startingValues["CURRENT_DEBT"]
                    }
                })
                var customer = customers[customers.length - 1]
                const index = customers.length - 1

                var idCell = newRow.insertCell(0)
                idCell.textContent = indexToWrite
                indexToWrite++


                var nameCell = newRow.insertCell(1)
                var nameInput = document.createElement("input")
                nameInput.type = "text";
                nameInput.id = "name-" + (index + 1);

                nameInput.placeholder = "הכנס שם תלמיד..."
                if (customer["data"]["NAME"] != undefined) {
                    nameInput.value = customer["data"]["NAME"]
                }

                nameInput.addEventListener('blur', (event) => {
                    nameInput.value = nameInput.value.trim()
                    customer["data"]["NAME"] = nameInput.value
                });
                nameCell.appendChild(nameInput)


                var debtCell = newRow.insertCell(2)
                if (!Object.hasOwn(customer["data"]["CURRENT_DEBT"], String(globals.getOperatingGrade()))) {
                    customer["data"]["CURRENT_DEBT"][String(globals.getOperatingGrade())] = 0
                }
                var debtInput = document.createElement('input');
                debtInput.type = 'number';

                debtInput.id = 'debt-' + (rowAmount - 1);
                debtInput.placeholder = "הכנס חוב נוכחי..."
                debtInput.value = customer["data"]["CURRENT_DEBT"][String(globals.getOperatingGrade())]/10;
                debtInput.step = '0.1';

                debtInput.addEventListener('blur', (event) => {
                    customer["data"]["CURRENT_DEBT"][globals.getOperatingGrade()] = parseInt(debtInput.value * 10)
                });

                debtCell.appendChild(debtInput)


                var roomCell = newRow.insertCell(3)
                var roomInput = document.createElement('input');

                roomInput.type = 'number';

                roomInput.id = 'room-' + (rowAmount - 1);
                roomInput.placeholder = "הכנס מס' חדר (עבור יומיים להשאיר ריק)..."
                roomInput.value = customer["data"]["ROOM_NUMBER"];
                roomInput.step = '1';

                roomInput.addEventListener('blur', (event) => {
                    roomInput.value = parseInt(roomInput.value)
                    customer["data"]["ROOM_NUMBER"] = roomInput.value
                });

                roomCell.appendChild(roomInput)

                
                var gradeCell = newRow.insertCell(4)
                var gradeInput = document.createElement('input');

                gradeInput.type = 'number';

                gradeInput.id = 'room-' + (rowAmount - 1);
                gradeInput.placeholder = "הכנס שכבה (ערך מספרי, כ\"ב -> 22)..."
                gradeInput.value = customer["data"]["GRADE"];
                gradeInput.step = '1';

                gradeInput.addEventListener('blur', (event) => {
                    gradeInput.value = parseInt(gradeInput.value)
                    customer["data"]["GRADE"] = gradeInput.value
                });
                gradeCell.appendChild(gradeInput)


                var phoneCell = newRow.insertCell(5)
                var phoneInput = document.createElement('input');

                phoneInput.type = 'tel';

                phoneInput.id = 'phone-' + (rowAmount - 1);
                phoneInput.placeholder = "הכנס מס' טלפון..."
                if (customer["data"]["PHONE_NUMBER"] != undefined) {
                    phoneInput.value = customer["data"]["PHONE_NUMBER"];
                }

                phoneInput.addEventListener('blur', (event) => {
                    phoneInput.value = phoneInput.value.replace(/\D/g, '');
                    customer["data"]["PHONE_NUMBER"] = phoneInput.value
                });

                phoneCell.appendChild(phoneInput)


                var customerTypeCell = newRow.insertCell(6)
                var customerTypeInput = document.createElement("select")
                customerTypeInput.id = "customer-type-" + (index + 1);

                globals.getCustomerTypes().forEach(type => {
                    const option = document.createElement("option")
                    option.value = type
                    option.textContent = type
                    customerTypeInput.appendChild(option)
                })
                
                customerTypeInput.value = customer["data"]["CUSTOMER_TYPE"]

                customerTypeInput.addEventListener('change', (event) => {
                    customer["data"]["CUSTOMER_TYPE"] = customerTypeInput.value
                });

                customerTypeCell.appendChild(customerTypeInput)
            }

            document.getElementById("addCustomerButton").addEventListener("click", event => {
                addCustomer({
                        "GRADE": undefined,
                        "PHONE_NUMBER": undefined,
                        "NAME": undefined,
                        "ROOM_NUMBER": undefined,
                        "CUSTOMER_TYPE": undefined,
                        "CURRENT_DEBT": {}
                    })
            })

            document.getElementById("sendChangesButton").addEventListener("click", async event => {
                await databaseHandler.updateCustomers(originalCustomers, customers)
                originalCustomers = JSON.parse(JSON.stringify(customers))
                console.log("success")
            })
        </script>
        <button id="sendChangesButton">שמור שינויים</button>

        <table id="customersTable">
            <thead>
                <tr>
                    <th>'מס</th>
                    <th>שם</th>
                    <th>חוב</th>
                    <th>מס' חדר</th>
                    <th>שכבה</th>
                    <th>מס' טלפון</th>
                    <th>סוג לקוח</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <button id="addCustomerButton">הוסף לקוח</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
