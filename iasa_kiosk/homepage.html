<!DOCTYPE html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="/iasa_kiosk/kiosk_favicon.jpeg">
</head>


<html>
    <body>
        <script type="module">
            import * as databaseHandler from "./database_handling.js"
            import * as globals from "./global_variables.js"
            import * as encryption from "./encryption_and_security.js"

            await databaseHandler.init()
            
            for (var i in Object.keys(encryption.webPageData)) {
                var page = Object.keys(encryption.webPageData)[i]
                if (encryption.isPageAccessible(page, databaseHandler.accessLevel)) {
                    const button = document.createElement("button")
                    button.textContent = encryption.webPageData[[page]]["displayName"]
                    button.addEventListener("click", () => {
                        location.href = page
                    })

                    document.getElementById("buttonsContainer").appendChild(button)
                }
            }
        </script>
        <div id="buttonsContainer">

        </div>
    </body>
</html>
