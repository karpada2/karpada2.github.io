<!DOCTYPE html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="/iasa_kiosk/kiosk_favicon.jpeg">
</head>


<html>
    <body>
        <script type="module">
            import * as databaseHandler from "./database_handling.js"
            import * as globals from "./global_variables.js"
            import * as encryption from "./encryption_and_security.js"

            await databaseHandler.init()

            const info = await databaseHandler.getRevenueInfo()

            console.log(info)

            const unclaimed = info["UNCLAIMED"]/10
            const bit = info["CLAIMED"]["ביט"]/10
            const cash = info["CLAIMED"]["מזומן"]/10

            document.getElementById("claimedMoneyTotal").textContent = (bit + cash).toFixed(2)
            document.getElementById("revenueBit").textContent = bit.toFixed(2)
            document.getElementById("revenueCash").textContent = cash.toFixed(2)
            document.getElementById("unclaimedDebts").textContent = (info["UNCLAIMED"]/10).toFixed(2)
            document.getElementById("totalRevenue").textContent = (bit + cash + unclaimed).toFixed(2)
        </script>
        <div>
            <h1>רווחים שנאספו:</h1>
            <p id="claimedMoneyTotal"></p>
            <h2>כסף שנאסף בביט:</h2>
            <p id="revenueBit"></p>
            <h2>כסף שנאסף במזומן:</h2>
            <p id="revenueCash"></p>
        </div>
        <div>
            <h1>סה"כ חובות שלא שולמו:</h1>
            <p id="unclaimedDebts"></p>
        </div>
        <div>
            <h1>סה"כ רווח משוער:</h1>
            <p id="totalRevenue"></p>
        </div>
    </body>
</html>
